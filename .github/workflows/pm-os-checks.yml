# Runs the full repo check on every PR, whatever paths it touches: secrets, PII,
# commercials, entry schema, indexes, case evidence (S7) and work-folder structure (S8).
name: pm-os checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node scripts/check.mjs
        run: node scripts/check.mjs
